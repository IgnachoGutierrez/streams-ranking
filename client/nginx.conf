# Serves the Angular bundle. Routing between domains, TLS and the /api proxy
# live in the edge proxy (../nginx), not here.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (e.g. /most-listened) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must always be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
