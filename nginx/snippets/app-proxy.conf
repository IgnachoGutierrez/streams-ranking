# Routes for the streams-ranking app. Included by the app server block in both
# the HTTP-only and the TLS templates.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# API: the trailing slash on proxy_pass strips the /api prefix, so
# /api/auth/login reaches the server as /auth/login.
location /api/ {
    proxy_pass http://api/;
}

# Everything else is the Angular app.
location / {
    proxy_pass http://app;
}
