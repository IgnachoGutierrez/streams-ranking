# Backends for the app. Included at http level by the default.conf templates,
# outside any server block.
#
# `resolve` makes nginx look the names up again through Docker's DNS
# (127.0.0.11) while it runs, so recreating a container with a new IP does not
# leave the proxy pointing at the old one. It also lets nginx start before
# the backends exist. Needs nginx 1.27.3 or later.
upstream api {
    zone api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server server:3000 resolve;
}

upstream app {
    zone app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server client:80 resolve;
}
